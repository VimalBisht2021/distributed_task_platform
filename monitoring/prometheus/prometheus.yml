global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "api-service"
    static_configs:
      - targets: ["host.docker.internal:5000"]

  - job_name: "worker-service"
    static_configs:
      - targets: ["host.docker.internal:3001"]

  - job_name: "scheduler-service"
    static_configs:
      - targets: ["host.docker.internal:3002"]