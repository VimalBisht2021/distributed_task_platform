services:
  postgres:
    image: postgres:16
    container_name: task-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: task-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    container_name: task-platform-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - WORKER_CONCURRENCY=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    container_name: task-platform-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: task-platform-grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  lab-service:
    build:
      context: .
      dockerfile: services/lab-service/Dockerfile
    container_name: task-platform-lab
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - API_URL=http://api-service:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/host
    depends_on:
      - api-service

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_LAB_SERVICE_URL: http://localhost:3006
    container_name: task-platform-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - api-service
      - lab-service

volumes:
  postgres_data:
  redis_data:
  grafana_data:
