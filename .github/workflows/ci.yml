name: DTP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install root dependencies
      run: npm ci
      
    - name: Install service dependencies
      run: |
        npm ci --prefix services/api-service
        npm ci --prefix services/worker-service
        npm ci --prefix services/scheduler-service
        npm ci --prefix apps/dashboard

    - name: Run unit & integration tests
      run: |
        npm test --prefix services/api-service
        npm test --prefix services/worker-service
        npm test --prefix services/scheduler-service
        
    - name: Run dashboard tests
      run: npx vitest run
      working-directory: ./apps/dashboard
