name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install service dependencies
      run: |
        npm ci --prefix apps/dashboard

    - name: ESLint & Prettier
      run: npm run lint --prefix apps/dashboard

    - name: TypeScript Compiler Check (Dashboard)
      run: npx tsc --noEmit
      working-directory: ./apps/dashboard
